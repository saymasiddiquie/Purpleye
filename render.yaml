services:
  # The Unified Purpleye Stack (API, Ingest, Aggregator, POS, Dashboard)
  - type: web
    name: purpleye-stack
    env: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python scripts/start_production.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: purpleye-db
          property: connectionString
      - key: REDIS_URL
        value: redis://purpleye-redis:6379

  # Redis Instance
  - type: redis
    name: purpleye-redis
    plan: free
    ipAllowList: [] # internal access only

databases:
  - name: purpleye-db
    user: store
    plan: free
